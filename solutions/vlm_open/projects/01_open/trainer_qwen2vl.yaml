kind: TrainerConfig
version: 1

# 실물 백본. 가중치 4.4GB 를 먼저 받아야 한다:
#
#   python -m vlm_trainer.cli.main backbones --fetch hf:Qwen/Qwen2-VL-2B-Instruct
#
# 이 설정으로 준비 -> 굽기 -> 학습 -> 추론이 끝까지 돈다(2026-09-23, RTX 3060 12GB 실측).
# 프로젝트는 `trainer.yaml`(tiny-vlm)을 가리키고 있다. 바꿔 끼우는 것은 한 줄이다:
#
#   ... pipeline <project.yaml> --set n_train.config_path=trainer_qwen2vl.yaml
#
# 실측 VRAM 은 projector_align 6.98 GB / lora_ft 11.58 GB 였다. **예산(G4)이 각각
# 6.7 / 6.2 GB 로 잡은 것보다 크다** — 특히 lora_ft 는 두 배 가깝다. 12GB 카드에서는
# 아슬아슬하게 들어간다. STATUS.md 의 "함정" 항목을 보라.
backbone: hf:Qwen/Qwen2-VL-2B-Instruct
dtype: bf16
quantization:
  mode: none

vision:
  max_images_per_sample: 1
  tiling: false
  tokens_per_tile: 256

sequence:
  max_len: 4096
  truncation: forbid

loss:
  chunked_ce: true
  chunk: 512

stages:
  - name: projector_align
    trainable: {vision_tower: "false", projector: "true", llm: "false"}
    optimizer: adamw_torch
    lr: 1.0e-3
    per_device: 2
    grad_accum: 4
    grad_checkpointing: false
    epochs: 4

  - name: lora_ft
    init_from: projector_align
    trainable: {vision_tower: "false", projector: "true", llm: "lora"}
    lora:
      r: 16
      alpha: 32
      targets: [q_proj, k_proj, v_proj, o_proj]
    optimizer: adamw_torch
    lr: 2.0e-4
    per_device: 2
    grad_accum: 4
    grad_checkpointing: true
    epochs: 4

budget:
  device: rtx4090_24gb
  policy: fail_fast
  headroom_ratio: 0.10
