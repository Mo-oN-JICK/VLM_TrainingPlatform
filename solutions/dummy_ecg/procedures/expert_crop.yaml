kind: Procedure
name: expert_crop
version: "1.0.0"
label: "관심영역 전처리"
hint: "전문가 모델이 지목한 영역을 잘라 이미지 목록으로 만듭니다."
summary: "전문가 모델이 지목한 영역을 잘라 고정 크기 이미지 목록으로 만든다."

# 같은 인터페이스(expert.propose)로 이미지 영역 지목과 시계열 구간 지목을 모두 받는다.
# 이 Procedure는 이미지 쪽이다. 시계열 쪽은 expert_interval_window로 따로 게시한다.
exposed_inputs:
  subject: {port: "n_exp:subject"}
  image: {port: "n_crop:image"}
exposed_outputs:
  crops: {port: "n_frame:items"}
  regions: {port: "n_exp:regions"}
exposed_params:
  plugin: {node: n_exp, param: plugin}
  topk: {node: n_exp, param: topk}
  score_threshold: {node: n_exp, param: score_threshold}
  padding_ratio: {node: n_crop, param: padding_ratio}
  max_n: {node: n_crop, param: max_n}

nodes:
  - id: n_exp
    type: "expert.propose@1.0.0"
    params: {plugin: "dummy_region_proposer@0.1.0", topk: 2, score_threshold: 0.0}

  - id: n_crop
    type: "image.crop_by_regions@1.0.0"
    params: {padding_ratio: 0.15, square_pad: true, max_n: 2, min_side_px: 16}

  # 리스트 원소마다 리사이즈 — 브로드캐스트가 없으므로 list.map으로 명시한다
  - id: n_resize
    type: "list.map@1.0.0"
    params:
      node: "adapt.image_resize@1.0.0"
      params: {size: [448, 448], mode: bilinear, keep_aspect: true, pad_value: 0}

  # crop을 그 자체로 하나의 이미지로 취급한다(원본 파형과 한 리스트에 담기 위해)
  - id: n_frame
    type: "list.map@1.0.0"
    params:
      node: "adapt.image_frame@1.0.0"
      params: {to: orig_px}

edges:
  - {from: "n_exp:regions", to: "n_crop:regions"}
  - {from: "n_crop:crops", to: "n_resize:items"}
  - {from: "n_resize:items", to: "n_frame:items"}
