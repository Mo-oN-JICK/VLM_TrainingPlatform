kind: TrainerConfig
version: 1

# 로컬 소형 백본. 다운로드 없이 학습 경로 전체를 실제로 태우기 위한 설정이다.
# 실물 2B 백본으로 바꾸는 것은 backbone 한 줄과 tokens_per_tile뿐이다.
backbone: tiny-vlm
dtype: bf16
quantization:
  mode: none

vision:
  max_images_per_sample: 0
  tiling: false
  tokens_per_tile: 0

sequence:
  max_len: 4096
  truncation: forbid
  chars_per_token: 0.34      # UTF-8 바이트 토크나이저 — 한글 한 글자가 3바이트다

loss:
  chunked_ce: true
  chunk: 256

stages:
  - name: projector_align
    trainable: {vision_tower: "false", projector: "true", llm: "false"}
    optimizer: adamw_torch
    lr: 1.0e-4
    per_device: 2
    grad_accum: 2
    grad_checkpointing: false
    epochs: 10

  - name: lora_ft
    init_from: projector_align
    trainable: {vision_tower: "false", projector: "true", llm: "lora"}
    lora:
      r: 8
      alpha: 16
      targets: [q_proj, k_proj, v_proj, o_proj]
    optimizer: adamw_torch
    lr: 5.0e-5
    per_device: 2
    grad_accum: 2
    grad_checkpointing: true
    epochs: 10

budget:
  device: rtx3060_12gb
  policy: fail_fast
  headroom_ratio: 0.10
